name: Build Stable APK (Manual)

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository == 'Noirero/Lalapo' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required signing secret: $key"
              exit 1
            fi
          done
          signing_store="$RUNNER_TEMP/lalapo-signing-check.keystore"
          if ! printf '%s' "$SIGNING_KEY" | base64 --decode > "$signing_store" 2>/dev/null ||
             ! keytool -list -keystore "$signing_store" -storepass "$KEY_STORE_PASSWORD" >/dev/null 2>&1; then
            decoded_once="$RUNNER_TEMP/lalapo-signing-once.txt"
            if ! printf '%s' "$SIGNING_KEY" | base64 --decode > "$decoded_once" 2>/dev/null ||
               ! base64 --decode "$decoded_once" > "$signing_store" 2>/dev/null ||
               ! keytool -list -keystore "$signing_store" -storepass "$KEY_STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::SIGNING_KEY is not a valid base64 JKS/PKCS12 keystore"
              exit 1
            fi
          fi

      - name: Assemble APK
        run: ./gradlew assembleRelease -Pinclude-cast
        env:
          LALAPO_GITHUB_RELEASE: 'true'
          LALAPO_VERSION_CODE: ${{ 200000 + github.run_number }}
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lalapo-Stable-${{ github.sha }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
