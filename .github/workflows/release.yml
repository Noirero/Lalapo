name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v*
      - r*

env:
  LALAPO_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    if: github.repository == 'Noirero/Lalapo'
    name: Extract tag name
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      is_preview: ${{ steps.extract.outputs.is_preview }}
    steps:
      - name: Get tag metadata
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == r* ]]; then
            echo "is_preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_preview=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: github.repository == 'Noirero/Lalapo'
    name: Build
    runs-on: 'ubuntu-24.04'
    needs: get_tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write client_secrets.json
        uses: DamianReeves/write-file-action@v1.2
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.CLIENT_SECRETS_TEXT }}
          write-mode: overwrite

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.get_tag.outputs.is_preview }}" == "true" ]]; then
            ./gradlew assemblePreview -Pinclude-cast -Penable-updater
          else
            ./gradlew assembleRelease -Pinclude-cast -Penable-updater
          fi
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.get_tag.outputs.is_preview }}" == "true" ]]; then
            variant="preview"
          else
            variant="release"
          fi

          mv "app/build/outputs/apk/${variant}/app-universal-${variant}.apk" "Lalapo-${{ needs.get_tag.outputs.tag }}.apk"
          mv "app/build/outputs/apk/${variant}/app-arm64-v8a-${variant}.apk" "Lalapo-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk"
          mv "app/build/outputs/apk/${variant}/app-armeabi-v7a-${variant}.apk" "Lalapo-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk"
          mv "app/build/outputs/apk/${variant}/app-x86-${variant}.apk" "Lalapo-x86-${{ needs.get_tag.outputs.tag }}.apk"
          mv "app/build/outputs/apk/${variant}/app-x86_64-${variant}.apk" "Lalapo-x86_64-${{ needs.get_tag.outputs.tag }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lalapo
          path: |
            Lalapo-${{ needs.get_tag.outputs.tag }}.apk
            Lalapo-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            Lalapo-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            Lalapo-x86-${{ needs.get_tag.outputs.tag }}.apk
            Lalapo-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    if: github.repository == 'Noirero/Lalapo' && needs.get_tag.outputs.is_preview != 'true'
    name: Build (FOSS)
    runs-on: 'ubuntu-24.04'
    needs: get_tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write client_secrets.json
        uses: DamianReeves/write-file-action@v1.2
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.CLIENT_SECRETS_TEXT }}
          write-mode: overwrite

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Build
        run: ./gradlew assembleFoss -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/foss/app-universal-foss.apk Lalapo-${{ needs.get_tag.outputs.tag }}-foss.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lalapo-foss
          path: Lalapo-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    if: >-
      always() &&
      github.repository == 'Noirero/Lalapo' &&
      needs.build.result == 'success' &&
      (needs.build_foss.result == 'success' || needs.build_foss.result == 'skipped')
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_tag, build, build_foss]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Delete workflow artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            Lalapo
            Lalapo-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Lalapo ${{ needs.get_tag.outputs.tag }}
          body: |
            Check the [past Lalapo releases](https://github.com/Noirero/Lalapo/releases) when upgrading from an earlier version.

            <!-->



            <!-->

            > [!TIP]
            >
            > If you are unsure which version to download, use `Lalapo-${{ needs.get_tag.outputs.tag }}.apk`.
          files: |
            Lalapo-${{ needs.get_tag.outputs.tag }}.apk
            Lalapo-${{ needs.get_tag.outputs.tag }}-foss.apk
            Lalapo-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            Lalapo-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            Lalapo-x86-${{ needs.get_tag.outputs.tag }}.apk
            Lalapo-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: ${{ needs.get_tag.outputs.is_preview != 'true' }}
          prerelease: ${{ needs.get_tag.outputs.is_preview == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
