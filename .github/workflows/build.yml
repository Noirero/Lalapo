name: CI Checks
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
      - '!i18n-aniyomi/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n-aniyomi/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n-aniyomi/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n-aniyomi/src/commonMain/moko-resources/base/plurals.xml'
      - '!i18n-animiru/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n-animiru/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n-animiru/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n-animiru/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main
      - beta

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Code Quality & Tests
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify category Sets legacy SQLite migration fixtures
        run: python3 scripts/test_category_sets_migration.py

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

